# Local development stack — Nakama + Postgres + Caddy (BACKEND.md §4).
# One command: docker compose up -d   (from this directory)
# Client base URL:  api = http://localhost:8080
#
# Production uses a DIFFERENT compose file generated by deploy.sh on the VPS
# (TLS ports, no default key fallbacks). This file is local-only.

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - nakama_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 1s
      timeout: 5s
      retries: 30
    # Deliberately NOT port-exposed: internal network only.

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    depends_on:
      postgres:
        condition: service_healthy
    # List form (sh -ecx) — a folded scalar gets mangled by compose/YAML
    # (deeper-indented lines keep their newlines, cutting off exec's flags).
    # DSN = user postgres, password from .env (official image convention).
    entrypoint:
      - /bin/sh
      - -ecx
      - |-
        /nakama/nakama migrate up --database.address postgres://postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama && \
        exec /nakama/nakama \
          --name nakama1 \
          --database.address postgres://postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama \
          --socket.server_key ${NAKAMA_SERVER_KEY:-defaultkey} \
          --session.encryption_key ${SESSION_ENCRYPTION_KEY:-defaultencryptionkey} \
          --session.refresh_encryption_key ${SESSION_REFRESH_ENCRYPTION_KEY:-defaultrefreshencryptionkey} \
          --session.token_expiry_sec 7200 \
          --runtime.path /nakama/functions \
          --logger.level info
    volumes:
      - ./functions:/nakama/functions:ro
    # Deliberately NOT port-exposed: Caddy is the only front door.

  caddy:
    image: caddy:2.10.0
    ports:
      - "8080:80"     # api base URL (static /config + proxy to Nakama)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config:/srv/config:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nakama

volumes:
  nakama_postgres_data:
  caddy_data:
  caddy_config:
